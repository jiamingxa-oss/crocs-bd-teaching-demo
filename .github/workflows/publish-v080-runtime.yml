name: Publish CROCS v0.8 Browser Runtime

on:
  push:
    branches:
      - publish/v080-runtime

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public demo main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch governed A-TEMP assets from source repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: c7e26c974b327a656e7fc5bae22d481884315c60
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v080 /tmp/crocs-v080
          fetch_private_file() {
            local path="$1"
            local out="$2"
            local encoded
            encoded="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/jiamingxa-oss/crocs-carbon-management-system/contents/${path}?ref=${SOURCE_REF}" \
              | jq -r '.content')"
            test -n "$encoded"
            printf '%s' "$encoded" | tr -d '\n' | base64 -d > "$out"
            test -s "$out"
          }

          fetch_private_file \
            '13_Demo/BD_Manufacturing/teaching-ui/generated/pages/crocs-teaching-v080.browser.js' \
            'v080/crocs-teaching-v080.browser.js'
          fetch_private_file \
            '13_Demo/BD_Manufacturing/teaching-ui/styles.css' \
            'v080/styles.css'
          fetch_private_file \
            '13_Demo/BD_Manufacturing/teaching-ui/playable.html' \
            '/tmp/crocs-v080/playable.html'

          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/crocs-v080/playable.html').read_text()
          src = src.replace('CROCS v0.8 · Local Playable Mode', 'CROCS v0.8 · Browser Playable Mode')
          src = src.replace('LOCAL PLAYABLE TEACHING', 'BROWSER PLAYABLE TEACHING')
          src = src.replace('LOCAL SERVICE · CONNECTING', 'BROWSER RUNTIME · READY TO START')
          src = src.replace('Genuine outcomes come from the\n          localhost authority.', 'Genuine outcomes come from the governed\n          browser runtime authority.')
          src = src.replace('No fabricated fallback. Local runtime is required.', 'No fabricated fallback. Governed Browser Runtime A-TEMP is active.')
          src = src.replace('<script type="module" src="playable-service-entry.js"></script>', '<script src="crocs-teaching-v080.browser.js" defer></script>')
          Path('v080/sandbox-v080.html').write_text(src)
          Path('sandbox-v080.html').write_text('''<!doctype html>\n<html lang="zh-CN">\n<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CROCS Teaching Sandbox v0.8</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f2}iframe{border:0;width:100%;height:100%;display:block}</style></head>\n<body><iframe src="v080/sandbox-v080.html" title="CROCS Teaching Sandbox v0.8"></iframe></body>\n</html>\n''')
          PY

          test -s v080/crocs-teaching-v080.browser.js
          test -s v080/styles.css
          test -s v080/sandbox-v080.html
          grep -q 'BrowserTeachingRuntimeV080' v080/crocs-teaching-v080.browser.js
          grep -q 'id="service-status"' v080/sandbox-v080.html
          grep -q 'id="progress"' v080/sandbox-v080.html
          grep -q 'id="cf-slot"' v080/sandbox-v080.html
          ! grep -q 'playable-service-entry.js' v080/sandbox-v080.html
          ! grep -q '127.0.0.1' v080/sandbox-v080.html
          ! grep -q '/api/teaching/' v080/sandbox-v080.html

      - name: Publish to public main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sandbox-v080.html v080/
          git diff --cached --check
          git commit -m 'feat(demo): publish genuine v0.8 browser runtime'
          git push origin HEAD:main
