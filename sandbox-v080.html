<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CROCS Teaching Sandbox v0.8</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f2}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
  <iframe id="crocs-v080" src="v080/sandbox-v080.html" title="CROCS Teaching Sandbox v0.8"></iframe>
  <script>
    // Publication bootstrap only. The governed v0.8 bundle owns all simulation logic.
    // PR #157 / CI #497 corrected the source entrypoint to call controller.start();
    // this wrapper starts the already-mounted public runtime without duplicating any business/carbon logic.
    const frame = document.getElementById('crocs-v080');
    frame.addEventListener('load', () => {
      let attempts = 0;
      const startMountedRuntime = () => {
        attempts += 1;
        const button = frame.contentDocument?.getElementById('new-session');
        if (button) {
          button.click();
          return;
        }
        if (attempts < 40) setTimeout(startMountedRuntime, 50);
      };
      startMountedRuntime();
    });
  </script>
</body>
</html>
